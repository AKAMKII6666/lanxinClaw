name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify release assets
        shell: pwsh
        run: |
          $releaseDir = "apps/companion/release"
          $installer = Get-ChildItem -Path $releaseDir -File -Filter "LanxinClaw-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "LanxinClaw installer was not produced"
          }
          if (-not (Test-Path "$releaseDir/SHA256SUMS.txt")) {
            throw "SHA256SUMS.txt was not produced"
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = "apps/companion/release"
          $assets = @(
            Get-ChildItem -Path $releaseDir -File |
              Where-Object { $_.Name -like "LanxinClaw-Setup-*-x64.exe" -or $_.Name -eq "SHA256SUMS.txt" } |
              ForEach-Object { $_.FullName }
          )
          gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "LanxinClaw $env:GITHUB_REF_NAME" `
            --generate-notes `
            --latest `
            --verify-tag
